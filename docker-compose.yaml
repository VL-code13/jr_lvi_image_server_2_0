services:
  app:
    build: .
    container_name: image_server_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      IMAGES_DIR: /app/images
      LOGS_DIR: /app/logs
    volumes:
      - ./images:/app/images  # папка images в корне проекта → /app/images в контейнере
      - ./logs:/app/logs      # папка logs в корне проекта → /app/logs в контейнере


  db:
    image: postgres:15
    container_name: image_server_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"


  nginx:
    image: nginx:1.27-alpine
    container_name: images_server_nginx
    restart: unless-stopped
    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/app/images:ro  # та же папка проекта → /app/images в nginx (только для чтения)

volumes:
  db_data:

