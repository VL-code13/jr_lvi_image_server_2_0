services:
  app:
    build: .
    container_name: image_server_app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      IMAGES_DIR: /app/images
      LOGS_DIR: /app/logs

    volumes:
      - ./images:/app/images  # папка images в корне проекта → /app/images в контейнере
      - ./logs:/app/logs      # папка logs в корне проекта → /app/logs в контейнере


  db:
    image: postgres:15
    container_name: image_server_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  nginx:
    image: nginx:1.27-alpine
    container_name: images_server_nginx
    restart: unless-stopped
    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/app/images:ro  # та же папка проекта → /app/images в nginx (только для чтения)


